version: "2"

# errcheck, govet, ineffassign, staticcheck (incl. gosimple), and unused
# are enabled by default in v2.
linters:
  enable:
    - misspell
    - godot
  settings:
    godot:
      scope: declarations
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
